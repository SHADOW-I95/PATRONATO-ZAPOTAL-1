<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - El Zapotal del Norte</title>
    <link rel="stylesheet" href="registro.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="form-card">
        
        <div class="logo-area">
            <img src="img/logo_-removebg-preview.png" alt="Logo El Zapotal del Norte" class="logo-img">
        </div>

        <form class="signup-form">

            
            <div class="input-group">
                <i class="fa-regular fa-user input-icon"></i>
                <input type="text" placeholder="Nombre" required>
            </div>

            
            <div class="input-group">
                <i class="fa-regular fa-user input-icon"></i>
                <input type="text" placeholder="Apellido" required>
            </div>
            
            <div class="input-group">
                <i class="fa-regular fa-address-card input-icon"></i>
                <input type="text" placeholder="DNI" required>
            </div>

            <div class="input-group">
                <i class="fa-regular fa-envelope input-icon"></i>
                <input type="email" placeholder="correo" required>
            </div>

            <div class="input-group">
                <i class="fa-solid fa-phone input-icon"></i>
                <input type="number" placeholder="Telefono" required>
            </div>

            <div class="input-group">
                <i class="fa-solid fa-lock input-icon"></i>
                <input type="contraseña" placeholder="contraseña" required>
            </div>

            <div class="input-group">
                <i class="fa-solid fa-lock input-icon"></i>
                <input type="contraseña" placeholder="Confirmar contraseña" required>
            </div>

            <button type="submit" class="btn-signup">Registrarse</button>
        </form>

        <div class="form-footer">
            <span>Ya tienes una cuenta? <a href="seccion.html" class="signin-link">Iniciar</a></span>
        </div>
        
    </div>

</body>
</html>

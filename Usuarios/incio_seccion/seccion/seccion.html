<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <link rel="stylesheet" href="seccion.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <div class="contenedor">

        <div class="logo">
            <img src="img/logo_-removebg-preview.png" alt="Logo">
            <h2>PATRONATO<br>DE AGUA</h2>
        </div>

        <form class="formulario" method="post" action="seccion.php">
            <div>
                <h1>Iniciar sesión</h1>
                <p>Accede a tu cuenta para continuar.</p>
            </div>

            <input type="text" placeholder="Usuario o correo electrónico" name="correo" required>

            <div class="password-box">
                <input type="password" id="password" placeholder="Contraseña" name="contrasena" required>
                <span onclick="mostrarPassword()">👁</span>
            </div>

            <button id="Ingresar" type="submit">Ingresar</button>

        </form>
    </div>

    <script src="seccion.js"></script>
</body>
</html>
